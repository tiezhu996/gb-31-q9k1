name: petsocial

services:
  mongodb:
    image: mongo:7
    container_name: ${COMPOSE_PROJECT_NAME:-petsocial}-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-petsocial_user}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-petsocial_pwd}
      MONGO_INITDB_DATABASE: ${DB_NAME:-petsocial_db}
    ports:
      - "${DB_PORT:-57604}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-petsocial}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "${REDIS_PORT:-46321}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME:-petsocial}-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-petsocial_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-petsocial_minio_secret}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_PORT:-47023}:9000"
      - "${MINIO_CONSOLE_PORT:-47026}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-petsocial}-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      MONGO_URI: mongodb://${DB_USER:-petsocial_user}:${DB_PASSWORD:-petsocial_pwd}@mongodb:27017/${DB_NAME:-petsocial_db}?authSource=admin
      DB_NAME: ${DB_NAME:-petsocial_db}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      JWT_EXPIRE_HOUR: "72"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-petsocial_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-petsocial_minio_secret}
      MINIO_BUCKET: petsocial-media
      MEDIA_PUBLIC_URL: http://localhost:${MINIO_PORT:-47023}
      CORS_ORIGINS: "*"
      RATE_LIMIT_PER_MINUTE: "300"
      SENSITIVE_WORDS: ${SENSITIVE_WORDS:-违禁词,赌博,暴力,色情,诈骗}
    ports:
      - "${BACKEND_PORT:-3103}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-petsocial}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8103}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
  minio_data:
